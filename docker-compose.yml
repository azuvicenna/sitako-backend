name: sitako-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: sitako-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=SITAKO-backend
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - app-storage:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: postgres:18-alpine
    container_name: sitako-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:trixie
    container_name: sitako-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  # --- Monitoring stack ---

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: sitako-postgres-exporter
    restart: unless-stopped
    environment:
      # Sesuaikan user/password/db dengan environment di service `database` di atas
      DATA_SOURCE_NAME: "postgresql://postgres:password@database:5432/mydb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: sitako-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: sitako-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - app
      - postgres_exporter
      - redis_exporter
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  prometheus-data:
    driver: local
